<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق البرامون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10b981">
<style>
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:#f5f5f5 url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') no-repeat center/cover fixed;min-height:100vh}
.top-banner{background:linear-gradient(90deg,#fff,#10b981);margin:12px;border-radius:20px;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.install-btn{background:#fff;color:#10b981;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.header{background:#ffffffd9;backdrop-filter:blur(10px);margin:12px;border-radius:20px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.bottom-nav{position:fixed;bottom:12px;left:12px;right:12px;background:#ffffffee;backdrop-filter:blur(10px);border-radius:25px;display:flex;justify-content:space-around;align-items:center;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.nav-item{text-align:center;font-size:12px;color:#666;text-decoration:none}
.nav-item.active{color:#10b981;font-weight:bold}
.add-btn{background:linear-gradient(135deg,#10b981,#06b6d4);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;border:none;cursor:pointer;margin-top:-20px}
.pill{background:#fff;padding:8px 16px;border-radius:20px;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,.1)}
</style>
</head>
<body>

<div class="top-banner" id="installBanner" style="display:none">
  <div>
    <b>⬇️ حمّل تطبيق سوق البرامون</b><br><small>هيبقى عندك على الشاشة زي الواتساب</small>
  </div>
  <button class="install-btn" id="btnInstall">تثبيت</button>
</div>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:45px;height:45px;background:linear-gradient(135deg,#10b981,#06b6d4);border-radius:12px;display:flex;align-items:center;justify-content:center">🛒</div>
    <div><b style="font-size:18px">سوق البرامون</b><br><small>سوق بلدنا من خير بلدنا</small></div>
  </div>
  <div>⚙️</div>
</div>

<div style="padding:12px;display:flex;justify-content:space-between">
  <div class="pill">0</div>
  <div class="pill">الأكثر طلباً</div>
</div>

<div class="bottom-nav">
  <a class="nav-item active" href="#">🏠<br>الرئيسية</a>
  <a class="nav-item" href="#">📦<br>الفئات</a>
  <button class="add-btn">+</button>
  <a class="nav-item" href="#">❤️<br>المفضلة</a>
  <a class="nav-item" href="#">👤<br>حسابي</a>
</div>

<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display='flex';
});
document.getElementById('btnInstall').addEventListener('click', async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice;
    if(outcome==='accepted') document.getElementById('installBanner').style.display='none';
    deferredPrompt=null;
  }
});
if(window.matchMedia('(display-mode: standalone)').matches){
  document.getElementById('installBanner').style.display='none';
}
</script>
</body>
</html>
