<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوق البرامون - سيرفر حقيقي</title><style>*{font-family:tahoma;box-sizing:border-box;margin:0}body{background:#f5f7f9}.h{background:#00cec9;padding:14px;color:#fff;text-align:center;font-weight:800;font-size:20px}.card{background:#fff;margin:10px;padding:12px;border-radius:16px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.ad{background:#fff;border-radius:16px;overflow:hidden}.ad img{width:100%;height:130px;object-fit:cover}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0}</style></head><body>
<div class="h">سوق البرامون - على سيرفر حقيقي 🟢</div>
<div class="card"><h3>انشر إعلانك - هيظهر لكل الناس فوراً</h3><input id="t" placeholder="مثال: شقة للبيع 140م"><input id="p" placeholder="السعر: 950,000 ج.م"><input id="ph" placeholder="رقمك: 010xxxx"><button onclick="pub()" style="width:100%;padding:14px;background:#00b894;color:#fff;border:0;border-radius:12px;font-weight:800">نشر على السيرفر 🚀</button></div>
<div id="list" class="grid"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getDatabase,ref,push,onValue} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "حط_هنا_apiKey",
  authDomain: "حط_هنا",
  databaseURL: "https://souq-albaramoon-default-rtdb.firebaseio.com",
  projectId: "souq-albaramoon",
  appId: "حط_هنا"
};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);const r=ref(db,'ads');
window.pub=()=>{let t=document.getElementById('t').value,p=document.getElementById('p').value,ph=document.getElementById('ph').value;if(!t)return alert('اكتب الإعلان');push(r,{title:t,price:p,phone:ph,time:Date.now()});alert('اتنشر! كل الناس هتشوفه');document.getElementById('t').value='';};
onValue(r,s=>{let d=s.val();let h='';if(!d)return;Object.values(d).reverse().forEach(a=>{h+=`<div class="ad"><div style="padding:8px"><b>${a.title}</b><br><span style="color:green">${a.price}</span><br><small>${a.phone}</small></div></div>`});document.getElementById('list').innerHTML=h;});
</script></body></html>
