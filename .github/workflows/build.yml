name: Build Souq Real APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"appId":"com.baramoon.souq","appName":"سوق البرامون","webDir":"www","server":{"url":"https://dazzling-neo-lithic-edit.base44.app","cleartext":true}}' > capacitor.config.json
      - run: npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
      - run: npx cap add android
      - run: npx cap copy android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: souq-albaramoon-REAL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
