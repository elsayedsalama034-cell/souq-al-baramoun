name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"appId":"com.baramoon.souq","appName":"سوق البرامون","webDir":"www"}' > capacitor.config.json

      - name: Install Capacitor 5 stable
        run: npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

      - name: Add Android
        run: npx cap add android

      - name: Copy Web
        run: npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souq-albaramoon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
