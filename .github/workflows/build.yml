name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Create Capacitor Config
        run: |
          echo '{"appId":"com.baramoon.souq","appName":"Souq","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          mkdir -p www
          cp index.html www/index.html
          cp -r *.html www/ 2>/dev/null || true

      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap add android
      - run: npx cap copy android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: souq-albaramoon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
